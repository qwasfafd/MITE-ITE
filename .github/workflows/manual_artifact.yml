name: Manual artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Place Minecraft jar in fml-loom cache
        run: |
          mkdir -p /home/runner/.gradle/caches/fml-loom/1.6.4-MITE/
          cp 1.6.4-MITE.jar /home/runner/.gradle/caches/fml-loom/1.6.4-MITE/1.6.4-MITE.jar

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MITE-ITEPlugin
          path: build/libs/*.jar
